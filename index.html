<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrapbook Game</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- HOME SCREEN -->
  <section id="home-screen" class="screen active">
    <div class="home-card">
      <h1>The Scrapbook</h1>
      <p>A strange scrapbook has appeared...</p>

      <button id="start-btn">Open Scrapbook</button>
    </div>
  </section>


  <!-- SCRAPBOOK SCREEN -->
  <section id="scrapbook-screen" class="screen">

    <div class="scrapbook">

      <div id="page-container">
        <!-- Page content will be added by JavaScript -->
      </div>

    </div>

    <div class="page-controls">
      <button id="prev-btn">← Previous</button>

      <span id="page-number"></span>

      <button id="next-btn">Next →</button>
    </div>

  </section>


  <script src="js/main.js"></script>

</body>
</html>
